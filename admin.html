<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#111111">
  <title>M’ma Tundé — Administration</title>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, Helvetica, sans-serif;
      background: #f5f5f5;
      color: #171717;
    }

    header {
      background: #111;
      color: white;
      padding: 18px 6%;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 15px;
    }

    header strong {
      display: block;
      font-size: 20px;
    }

    header small {
      color: #bbb;
    }

    button {
      cursor: pointer;
    }

    .logout {
      border: 1px solid #555;
      background: #222;
      color: white;
      padding: 10px 15px;
      border-radius: 8px;
    }

    main {
      max-width: 1100px;
      margin: auto;
      padding: 30px 15px;
    }

    .login,
    .panel {
      background: white;
      border-radius: 15px;
      padding: 25px;
      box-shadow: 0 5px 20px #00000012;
    }

    .login {
      max-width: 430px;
      margin: 60px auto;
    }

    h1, h2 {
      margin-top: 0;
    }

    label {
      display: block;
      font-weight: bold;
      font-size: 14px;
      margin-top: 15px;
    }

    input,
    select,
    textarea {
      width: 100%;
      padding: 12px;
      margin-top: 6px;
      border: 1px solid #ddd;
      border-radius: 8px;
      font: inherit;
    }

    textarea {
      min-height: 90px;
      resize: vertical;
    }

    .primary {
      width: 100%;
      margin-top: 18px;
      padding: 13px;
      border: 0;
      border-radius: 8px;
      background: #d99b27;
      color: #111;
      font-weight: bold;
    }

    .message {
      margin-top: 15px;
      padding: 12px;
      border-radius: 8px;
      display: none;
    }

    .error {
      background: #ffe5e5;
      color: #a00000;
    }

    .success {
      background: #e5f8e8;
      color: #126b20;
    }

    .hidden {
      display: none !important;
    }

    .top-info {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 15px;
      margin-bottom: 25px;
    }

    .card {
      background: white;
      padding: 20px;
      border-radius: 12px;
      box-shadow: 0 4px 15px #0000000b;
    }

    .card strong {
      display: block;
      font-size: 25px;
      margin-top: 5px;
    }

    .form-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 15px;
    }

    .form-full {
      grid-column: 1 / -1;
    }

    .actions {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
    }

    .btn {
      padding: 9px 12px;
      border: 0;
      border-radius: 7px;
      font-weight: bold;
    }

    .edit {
      background: #eee;
    }

    .delete {
      background: #b00020;
      color: white;
    }

    .availability {
      background: #222;
      color: white;
    }

    .table-wrapper {
      overflow-x: auto;
      margin-top: 20px;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      min-width: 750px;
    }

    th,
    td {
      text-align: left;
      padding: 12px;
      border-bottom: 1px solid #eee;
    }

    th {
      background: #f7f7f7;
    }

    .role {
      display: inline-block;
      padding: 5px 9px;
      border-radius: 20px;
      background: #eee;
      font-size: 12px;
      font-weight: bold;
    }

    @media (max-width: 700px) {
      .top-info {
        grid-template-columns: 1fr;
      }

      .form-grid {
        grid-template-columns: 1fr;
      }

      .form-full {
        grid-column: auto;
      }

      header {
        padding: 15px;
      }
    }
  </style>
</head>

<body>

<header>
  <div>
    <strong>🍽️ M’ma Tundé</strong>
    <small>Espace de gestion</small>
  </div>

  <button id="logoutBtn" class="logout hidden" onclick="logout()">
    Déconnexion
  </button>
</header>

<main>

  <!-- CONNEXION -->
  <section id="loginSection" class="login">

    <h1>🔐 Connexion</h1>

    <p>
      Connectez-vous à votre espace M’ma Tundé.
    </p>

    <label>
      Adresse e-mail
      <input
        id="email"
        type="email"
        placeholder="Votre adresse e-mail"
        autocomplete="email"
      >
    </label>

    <label>
      Mot de passe
      <input
        id="password"
        type="password"
        placeholder="Votre mot de passe"
        autocomplete="current-password"
      >
    </label>

    <button class="primary" onclick="login()">
      Se connecter
    </button>

    <div id="loginMessage" class="message"></div>

  </section>


  <!-- ESPACE GESTION -->
  <section id="dashboard" class="hidden">

    <div class="top-info">

      <div class="card">
        <span>Utilisateur</span>
        <strong id="userEmail">—</strong>
      </div>

      <div class="card">
        <span>Rôle</span>
        <strong id="userRole">—</strong>
      </div>

      <div class="card">
        <span>Nombre de plats</span>
        <strong id="productCount">0</strong>
      </div>

    </div>


    <!-- FORMULAIRE PLAT -->
    <section class="panel">

      <h2 id="formTitle">➕ Ajouter un plat</h2>

      <input id="productId" type="hidden">

      <div class="form-grid">

        <div>
          <label>
            Nom du plat
            <input id="nom" placeholder="Ex. Chawarma poulet">
          </label>
        </div>

        <div>
          <label>
            Prix (GNF)
            <input id="prix" type="number" placeholder="40000">
          </label>
        </div>

        <div>
          <label>
            Catégorie
            <input id="categorie" placeholder="Ex. Chawarma">
          </label>
        </div>

        <div>
          <label>
            Image URL
            <input id="imageUrl" placeholder="https://...">
          </label>
        </div>

        <div class="form-full">
          <label>
            Description
            <textarea id="description"
              placeholder="Description du plat"></textarea>
          </label>
        </div>

        <div>
          <label>
            Disponible
            <select id="disponible">
              <option value="true">Oui</option>
              <option value="false">Non</option>
            </select>
          </label>
        </div>

      </div>

      <div class="actions" style="margin-top:18px">

        <button class="btn primary"
                style="width:auto"
                onclick="saveProduct()">
          💾 Enregistrer
        </button>

        <button class="btn edit"
                onclick="resetForm()">
          Annuler
        </button>

      </div>

      <div id="formMessage" class="message"></div>

    </section>


    <!-- LISTE DES PLATS -->
    <section class="panel" style="margin-top:25px">

      <h2>🍽️ Gestion des plats</h2>

      <div class="table-wrapper">

        <table>

          <thead>
            <tr>
              <th>ID</th>
              <th>Nom</th>
              <th>Catégorie</th>
              <th>Prix</th>
              <th>Disponible</th>
              <th>Actions</th>
            </tr>
          </thead>

          <tbody id="productsTable">
          </tbody>

        </table>

      </div>

    </section>

  </section>

</main>


<script>

  const SUPABASE_URL =
    "https://rvvuozouvswnmnthldpt.supabase.co";

  const SUPABASE_ANON_KEY =
    "sb_publishable_foNeeSBsHmI1D_XlXJevZA_dirTlK5j";

  const { createClient } =
    supabase;

  const db = createClient(
    SUPABASE_URL,
    SUPABASE_ANON_KEY
  );


  let currentUser = null;
  let currentProfile = null;
  let products = [];


  function showMessage(id, text, type = "error") {

    const box = document.getElementById(id);

    box.textContent = text;
    box.className = "message " + type;
    box.style.display = "block";

  }


  function hideMessage(id) {

    const box = document.getElementById(id);

    box.style.display = "none";

  }


  async function login() {

    hideMessage("loginMessage");

    const email =
      document.getElementById("email").value.trim();

    const password =
      document.getElementById("password").value;

    if (!email || !password) {

      showMessage(
        "loginMessage",
        "Veuillez saisir votre e-mail et votre mot de passe."
      );

      return;
    }


    const { data, error } =
      await db.auth.signInWithPassword({
        email,
        password
      });


    if (error) {

      showMessage(
        "loginMessage",
        "Connexion impossible : " + error.message
      );

      return;
    }


    currentUser = data.user;

    await loadProfile();

  }


  async function loadProfile() {

    const { data, error } =
      await db
        .from("profiles")
        .select("id,email,role,nom")
        .eq("id", currentUser.id)
        .single();


    if (error || !data) {

      await db.auth.signOut();

      showMessage(
        "loginMessage",
        "Votre profil de gestion n'a pas été trouvé."
      );

      return;
    }


    currentProfile = data;


    const role =
      String(data.role || "").toLowerCase();


    if (
      role !== "admin" &&
      role !== "administrateur" &&
      role !== "gestionnaire"
    ) {

      await db.auth.signOut();

      showMessage(
        "loginMessage",
        "Vous n'avez pas l'autorisation d'accéder à cet espace."
      );

      return;
    }


    document.getElementById("loginSection")
      .classList.add("hidden");

    document.getElementById("dashboard")
      .classList.remove("hidden");

    document.getElementById("logoutBtn")
      .classList.remove("hidden");

    document.getElementById("userEmail")
      .textContent = data.email || currentUser.email;

    document.getElementById("userRole")
      .textContent =
        role === "admin" || role === "administrateur"
          ? "Administrateur"
          : "Gestionnaire";


    applyPermissions();

    await loadProducts();

  }


  function applyPermissions() {

    const role =
      String(currentProfile.role || "").toLowerCase();


    /*
      Pour le moment les deux rôles peuvent gérer les plats.
      Nous pourrons ensuite limiter précisément les droits
      du Gestionnaire.
    */

    if (
      role === "gestionnaire"
    ) {

      // Le gestionnaire pourra gérer les plats,
      // mais ne verra pas les futures fonctions
      // réservées à l'administrateur.

    }

  }


  async function loadProducts() {

    const { data, error } =
      await db
        .from("Plats")
        .select("*")
        .order("id", { ascending: true });


    if (error) {

      showMessage(
        "formMessage",
        "Impossible de charger les plats : " +
        error.message
      );

      return;
    }


    products = data || [];

    document.getElementById("productCount")
      .textContent = products.length;

    renderProducts();

  }


  function renderProducts() {

    const tbody =
      document.getElementById("productsTable");


    if (!products.length) {

      tbody.innerHTML = `
        <tr>
          <td colspan="6">
            Aucun plat trouvé.
          </td>
        </tr>
      `;

      return;
    }


    tbody.innerHTML =
      products.map(p => `

        <tr>

          <td>${p.id ?? ""}</td>

          <td>
            <strong>${escapeHtml(p.nom || "")}</strong>
          </td>

          <td>
            ${escapeHtml(p["Catégorie"] || "")}
          </td>

          <td>
            ${Number(p.Prix || 0).toLocaleString("fr-FR")}
            GNF
          </td>

          <td>
            <span class="role">
              ${p.Disponible ? "Disponible" : "Masqué"}
            </span>
          </td>

          <td>

            <div class="actions">

              <button
                class="btn edit"
                onclick="editProduct(${p.id})">
                Modifier
              </button>

              <button
                class="btn availability"
                onclick="toggleAvailability(${p.id}, ${!p.Disponible})">
                ${p.Disponible ? "Masquer" : "Afficher"}
              </button>

              <button
                class="btn delete"
                onclick="deleteProduct(${p.id})">
                Supprimer
              </button>

            </div>

          </td>

        </tr>

      `).join("");

  }


  function editProduct(id) {

    const p =
      products.find(item => item.id == id);

    if (!p) return;


    document.getElementById("productId")
      .value = p.id;

    document.getElementById("nom")
      .value = p.nom || "";

    document.getElementById("prix")
      .value = p.Prix || "";

    document.getElementById("categorie")
      .value = p["Catégorie"] || "";

    document.getElementById("description")
      .value = p.Description || "";

    document.getElementById("imageUrl")
      .value = p.image_url || "";

    document.getElementById("disponible")
      .value = p.Disponible ? "true" : "false";

    document.getElementById("formTitle")
      .textContent = "✏️ Modifier le plat";

    window.scrollTo({
      top: 0,
      behavior: "smooth"
    });

  }


  async function saveProduct() {

    hideMessage("formMessage");


    const id =
      document.getElementById("productId").value;

    const nom =
      document.getElementById("nom").value.trim();

    const prix =
      Number(document.getElementById("prix").value);

    const categorie =
      document.getElementById("categorie").value.trim();

    const description =
      document.getElementById("description").value.trim();

    const imageUrl =
      document.getElementById("imageUrl").value.trim();

    const disponible =
      document.getElementById("disponible").value === "true";


    if (!nom || !prix || !categorie) {

      showMessage(
        "formMessage",
        "Nom, prix et catégorie sont obligatoires."
      );

      return;
    }


    const payload = {

      nom: nom,

      Prix: prix,

      "Catégorie": categorie,

      Description: description,

      image_url: imageUrl,

      Disponible: disponible

    };


    let result;


    if (id) {

      result =
        await db
          .from("Plats")
          .update(payload)
          .eq("id", id);

    } else {

      result =
        await db
          .from("Plats")
          .insert(payload);

    }


    if (result.error) {

      showMessage(
        "formMessage",
        "Erreur : " + result.error.message
      );

      return;
    }


    showMessage(
      "formMessage",
      id
        ? "Plat modifié avec succès."
        : "Plat ajouté avec succès.",
      "success"
    );


    resetForm();

    await loadProducts();

  }


  async function toggleAvailability(id, value) {

    const { error } =
      await db
        .from("Plats")
        .update({
          Disponible: value
        })
        .eq("id", id);


    if (error) {

      alert(
        "Impossible de modifier la disponibilité : " +
        error.message
      );

      return;
    }


    await loadProducts();

  }


  async function deleteProduct(id) {

    const product =
      products.find(p => p.id == id);


    if (!product) return;


    const confirmed =
      confirm(
        "Voulez-vous vraiment supprimer le plat « " +
        product.nom +
        " » ?"
      );


    if (!confirmed) return;


    const { error } =
      await db
        .from("Plats")
        .delete()
        .eq("id", id);


    if (error) {

      alert(
        "Suppression impossible : " +
        error.message
      );

      return;
    }


    await loadProducts();

  }


  function resetForm() {

    document.getElementById("productId")
      .value = "";

    document.getElementById("nom")
      .value = "";

    document.getElementById("prix")
      .value = "";

    document.getElementById("categorie")
      .value = "";

    document.getElementById("description")
      .value = "";

    document.getElementById("imageUrl")
      .value = "";

    document.getElementById("disponible")
      .value = "true";

    document.getElementById("formTitle")
      .textContent = "➕ Ajouter un plat";

  }


  async function logout() {

    await db.auth.signOut();

    currentUser = null;
    currentProfile = null;

    document.getElementById("dashboard")
      .classList.add("hidden");

    document.getElementById("logoutBtn")
      .classList.add("hidden");

    document.getElementById("loginSection")
      .classList.remove("hidden");

    resetForm();

  }


  function escapeHtml(value) {

    return String(value)
      .replace(/&/g, "&amp;")
      .replace(/</g, "&lt;")
      .replace(/>/g, "&gt;")
      .replace(/"/g, "&quot;")
      .replace(/'/g, "&#039;");

  }


  async function checkExistingSession() {

    const { data } =
      await db.auth.getSession();


    if (data.session) {

      currentUser = data.session.user;

      await loadProfile();

    }

  }


  checkExistingSession();

</script>

</body>
</html>
